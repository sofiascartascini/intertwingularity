<script>
  const cd = document.querySelector('[alt="a compact disc"]')
  cd.style.position = 'absolute'

  function animate() {
    requestAnimationFrame(animate)
    const time = Date.now()
    const radius = window.innerWidth * 0.1
    const scale = -0.001
    const offset = {
      x: window.innerWidth * 0.5,
      y: window.innerHeight * 0.5
    }
    const x = Math.sin(time * scale) * radius + offset.x
    const y = Math.cos(time * scale) * radius + offset.y
    cd.style.left = `${x}px`
    cd.style.top = `${y}px`
  }

  window.addEventListener('load', animate)
</script>
